<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevLinks | Seu Nome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <!-- Perfil -->
      <header id="profile">
        <img src="assets/avatar.svg" alt="Foto de perfil" />
        <h1>Seu Nome</h1>
        <p>@seuusuario</p>
      </header>

      <!-- Botão de tema (light / dark) -->
      <div id="switch">
        <button type="button" aria-label="Alternar tema claro e escuro"></button>
        <span></span>
      </div>

      <!-- Links -->
      <ul>
        <li><a href="https://github.com/" target="_blank">Meu GitHub</a></li>
        <li><a href="#" target="_blank">Meu portfólio</a></li>
        <li><a href="#" target="_blank">Projeto DevLinks</a></li>
        <li><a href="#" target="_blank">Fale comigo</a></li>
      </ul>

      <!-- Redes sociais -->
      <nav id="social-links" aria-label="Redes sociais">
        <a href="https://github.com/" target="_blank" aria-label="GitHub">
          <ion-icon name="logo-github"></ion-icon>
        </a>
        <a href="https://instagram.com/" target="_blank" aria-label="Instagram">
          <ion-icon name="logo-instagram"></ion-icon>
        </a>
        <a href="https://youtube.com/" target="_blank" aria-label="YouTube">
          <ion-icon name="logo-youtube"></ion-icon>
        </a>
        <a href="https://linkedin.com/" target="_blank" aria-label="LinkedIn">
          <ion-icon name="logo-linkedin"></ion-icon>
        </a>
      </nav>

      <footer>Feito com 💜 no Discover</footer>
    </div>

    <script src="main.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
